aid: slang-ai
name: Slang Ai
description: >-
  Slang AI is a voice-AI phone-answering and reservation platform for
  restaurants. Its customizable virtual phone agent answers every inbound call
  24/7 in a natural, human-like voice, instantly responds to guest inquiries,
  and automatically manages reservations, with official integrations to
  OpenTable, SevenRooms, Tripleseat, Yelp, and Fishbowl. Founded by former
  Spotify data scientists, Slang AI reports 96%+ guest satisfaction (CSAT), 50%
  more phone reservations, and up to 200 staff hours saved per month. It is
  offered as a hosted SaaS product across Core, Premium, and Enterprise plans;
  at the time of profiling it exposes no public developer API, OpenAPI
  specification, SDKs, or developer portal.
